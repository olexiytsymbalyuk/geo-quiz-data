# Політика топонімів (правило 2.1 брифу). Єдине місце в обох репозиторіях, де записані
# російські форми назв: блок-лист екзонімів. Сторож tests/unit/test_repo_text.py
# виключає лише цей файл. У застосунку для тестів відхилення беруть blocked_sentinel.

# Нейтральна суша: без назв, без інтерактиву, без відповідей, у всіх атласах.
neutral_countries: [RU, BY]

# Сусіди, що підписуються на мапі України (назви — з name:uk).
named_neighbours: [PL, SK, HU, RO, MD]

# Скільки назв мінімум має бути на стартову літеру ланцюжка «Міст».
startable_min: 10

# Запис, що завжди є в блок-листі: ним тестуються гілки відхилення без реальних російських форм.
blocked_sentinel: zz-blocked-test-form

# Блок-лист екзонімів (бриф, Додаток Б, test_exonym_blocklist; Kiev/Odessa/Kharkov — §10).
# Порівнюється після нормалізації §5.8; значення name*/aliases не мають збігатися з жодним записом.
exonym_blocklist:
  - Киев
  - Kiev
  - Харьков
  - Kharkov
  - Николаев
  - Nikolaev
  - Запорожье
  - Zaporozhye
  - Ровно
  - Rovno
  - Львов
  - Lvov
  - Чернигов
  - Chernigov
  - Днепр
  - Dnepr
  - Крым
  - Krym
  - Одесса
  - Odessa
  - Белгород-Днестровский
  - zz-blocked-test-form

# Перейменування, які газетир мусить містити: нова назва — names.uk, стара — лише former[].
# Усі назви тут українські (стара — радянська чи русифікована, але записана українськими літерами).
