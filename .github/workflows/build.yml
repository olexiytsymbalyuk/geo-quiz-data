# Ручна збірка атласу «Україна» (M0): fetch -> build -> ворота -> pre-release `m0`.
# Ворота не послаблюються: червоні ворота валять запуск, але артефакти до того вже вивантажені
# (actions/upload-artifact), тож їх можна оглянути. Pre-release створює окремий job лише після зеленого build.
name: Збірка атласу

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версія датасету YYYY.MM.N"
        required: true
        default: "2026.11.1"
        type: string

permissions:
  contents: read

concurrency:
  group: build-atlas
  cancel-in-progress: false

jobs:
  # Єдине місце, де сирий вхід потрапляє в оболонку; усі інші job беруть версію лише з виходу цього.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Перевірити версію
        id: check
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]{4}\.(0[1-9]|1[0-2])\.[0-9]+$ ]]; then
            echo "::error::версія має вигляд YYYY.MM.N"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Залежності
        run: uv pip install --system -r requirements-dev.txt  # GNU time (/usr/bin/time) уже є на ubuntu-latest

      - name: Образ інструментів (osmium, tippecanoe)
        run: python -m pipeline.tools build

      - name: Юніт-тести й самотест воріт
        run: python -m pytest tests/unit tests/gates_selftest -q

      # Ключ кешу -- лише хеш lock. Земельні полігони тут -- обрізаний asset релізу sources-2026-10 (≈ 5 МБ, sha256 у lock),
      # а не рухомий щоденний архів на 929 МБ. Часткового кешу (fetch упав посередині) повний ключ не займає:
      # він незмінний, тож недокачане лягає під ключ із суфіксом -partial-<запуск>, а restore-keys підхоплює його.
      - name: Кеш сирих джерел
        id: raw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw
          key: raw-${{ hashFiles('config/sources.lock') }}
          restore-keys: |
            raw-${{ hashFiles('config/sources.lock') }}-partial-

      - name: Завантажити сирі джерела
        id: fetch
        run: python -m pipeline.fetch

      - name: Зберегти кеш сирих джерел
        if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw
          key: raw-${{ hashFiles('config/sources.lock') }}

      # fetch качає через <файл>.part і перейменовує лише після перевірки sha256, але обірваний запуск міг лишити .part.
      - name: Прибрати недокачане після збою fetch
        if: ${{ !cancelled() && steps.fetch.outcome == 'failure' }}
        run: find data/raw -name '*.part' -delete

      - name: Зберегти частковий кеш після збою fetch
        if: ${{ !cancelled() && steps.fetch.outcome == 'failure' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw
          key: raw-${{ hashFiles('config/sources.lock') }}-partial-${{ github.run_id }}

      # Wikidata build запитує вживу (кеш wikidata-<дата>.json у data/raw): збірки не відтворювані між запусками,
      # момент запиту записано в manifest.json як wikidata_queried_at.
      - name: Збірка релізу
        run: /usr/bin/time -v -o build-time.txt python -m pipeline.build --version "$VERSION"

      - name: Час і пік пам'яті в підсумок
        if: always()
        run: |
          if [ -f build-time.txt ]; then
            cat build-time.txt
            {
              echo "### Збірка $VERSION"
              echo '```'
              grep -E "Elapsed \(wall clock\)|Maximum resident set size" build-time.txt || true
              echo '```'
              echo "Пік пам'яті тут -- лише процес Python на хості; кроки osmium і tippecanoe йдуть у Docker."
              echo "Збірки не відтворювані між запусками: Wikidata запитується вживу, момент запиту -- wikidata_queried_at у manifest.json."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "dist/$VERSION/metrics.json" ]; then
            python - "dist/$VERSION/metrics.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          steps = json.load(open(sys.argv[1], encoding="utf-8"))["steps"]
          print()
          print("| Крок | с | Python: накопичений пік, MB | Docker-інструмент: пік команди, MB |")
          print("|---|---|---|---|")
          for name, step in steps.items():
              python_peak = step.get("python_peak_rss_mb")
              tool_peak = step.get("tool_max_rss_mb")
              print(
                  f"| {name} | {step.get('seconds', '')} | "
                  f"{'' if python_peak is None else round(python_peak)} | "
                  f"{'' if tool_peak is None else round(tool_peak)} |"
              )
          print()
          print(
              "Накопичений пік Python -- максимум процесу за весь час до цього кроку; "
              "пік Docker-інструмента -- окрема команда в контейнері. "
              "Саме пік Docker-інструментів визначає, чи вистачає пам'яті раннера."
          )
          PY
          fi

      - name: Ворота
        run: python -m pytest tests/gates --dataset "dist/$VERSION" --lock config/sources.lock --raw data/raw -q

      # Репозиторій публічний: датасет вивантажується лише після зелених воріт (за success() за замовчуванням).
      - name: Вивантажити датасет (після воріт)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dataset-${{ env.VERSION }}
          path: dist/${{ env.VERSION }}
          if-no-files-found: error
          retention-days: 14

      # Звіти воріт -- лише числа й назви областей.
      - name: Звіти воріт
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gates-report-${{ env.VERSION }}
          path: data/work/gates
          if-no-files-found: ignore
          retention-days: 14

      # На провал -- лише діагностика без даних (метрики й маніфест); тайли й газетир не вивантажуються.
      - name: Діагностика збірки (без даних)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ env.VERSION }}
          path: |
            dist/${{ env.VERSION }}/metrics.json
            dist/${{ env.VERSION }}/manifest.json
            dist/${{ env.VERSION }}.partial/metrics.json
            dist/${{ env.VERSION }}.partial/manifest.json
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: [validate, build]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dataset-${{ env.VERSION }}
          path: release-files

      - name: Pre-release m0
        run: |
          files=(
            "release-files/ukraine-$VERSION.pmtiles"
            "release-files/gazetteer-$VERSION.sqlite"
            "release-files/gazetteer-ukraine-$VERSION.json"
            "release-files/manifest.json"
            "release-files/metrics.json"
          )
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::error::немає файла $f"; exit 1; }
          done
          notes="Ворота зелені; версія датасету $VERSION; збірка $GITHUB_SHA.
          © OpenStreetMap contributors, ODbL 1.0; КАТОТТГ — Міністерство розвитку громад та територій України (Мінрозвитку), CC BY 4.0; Natural Earth — public domain; Wikidata — CC0. Газетир — похідна база даних під ODbL 1.0."
          if gh release view m0 >/dev/null 2>&1; then
            gh release edit m0 --prerelease --title "M0: атлас Україна $VERSION" --notes "$notes"
          else
            gh release create m0 --prerelease --target "$GITHUB_SHA" --title "M0: атлас Україна $VERSION" --notes "$notes"
          fi
          # Один плаваючий реліз m0: старі файли інших версій не лишаємо, щоб у ньому були рівно п'ять файлів.
          keep=$(printf '%s\n' "${files[@]##*/}")
          gh release view m0 --json assets --jq '.assets[].name' | while read -r asset; do
            if ! grep -qxF "$asset" <<< "$keep"; then
              gh release delete-asset m0 "$asset" --yes
            fi
          done
          gh release upload m0 "${files[@]}" --clobber
